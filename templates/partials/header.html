<header class="full-width sticky">
  <div class="container d-flex items-center justify-between py-2">
    <a href="/" class="site-logo">omni<span class="logo-accent">deck</span></a>

    <!-- Desktop nav -->
    <nav class="d-flex gap-4 items-center nav-desktop">
      {% for item in Data.nav.items %}
        <a href="{{ item.url }}" class="nav-link">{{ item.label }}</a>
      {% endfor %}
      <dark-mode-toggle></dark-mode-toggle>
    </nav>

    <!-- Mobile nav toggle -->
    <button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-mobile">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
  </div>

  <!-- Mobile nav drawer -->
  <nav id="nav-mobile" class="nav-mobile" aria-label="Mobile navigation" aria-hidden="true">
    {% for item in Data.nav.items %}
      <a href="{{ item.url }}" class="nav-mobile-link">{{ item.label }}</a>
    {% endfor %}
    <div class="nav-mobile-footer">
      <dark-mode-toggle></dark-mode-toggle>
    </div>
  </nav>
</header>
