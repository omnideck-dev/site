<header class="site-header">
  <div class="container site-header-inner">
    <a href="/" class="site-logo" aria-label="omnideck home">
      <img src="/images/omnideck-app-icon.svg" alt="" width="28" height="28">
      <span>omnideck</span>
    </a>

    <nav class="nav-desktop" aria-label="Primary navigation">
      {% for item in Data.nav.items %}
        <a href="{{ item.url }}" class="nav-link">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <div class="header-actions">
      <button type="button" class="theme-toggle" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 16 16" aria-hidden="true"><use href="/icons/bootstrap-icons.svg#bi-brightness-high"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 16 16" aria-hidden="true"><use href="/icons/bootstrap-icons.svg#bi-moon"/></svg>
      </button>

    <button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-mobile">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    </div>
  </div>

  <nav id="nav-mobile" class="nav-mobile" aria-label="Mobile navigation" aria-hidden="true">
    <div class="container nav-mobile-inner">
    {% for item in Data.nav.items %}
      <a href="{{ item.url }}" class="nav-mobile-link">{{ item.label }}</a>
    {% endfor %}
    </div>
  </nav>
  <button class="nav-backdrop" type="button" aria-label="Close menu" tabindex="-1"></button>
</header>
