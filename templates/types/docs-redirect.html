{% extends "templates/layouts/base.html" %}
{% block title %}{{ Page.Title }} | Docs | {{ Site.Config.Site.Title }}{% endblock %}
{% block head %}
  <link rel="canonical" href="{{ Site.Config.Site.BaseURL }}{{ Page.Meta.Fields.canonical }}">
  <meta http-equiv="refresh" content="0; url={{ Page.Meta.Fields.redirect }}">
  <script>
    const destination = `{{ Page.Meta.Fields.redirect }}`;
    const baseDestination = destination.split('#')[0];
    location.replace(location.hash ? `${baseDestination}${location.hash}` : destination);
  </script>
{% endblock %}
{% block body %}
<section class="home-section">
  <div class="container">
    <h1>{{ Page.Title }}</h1>
    <p>This page has moved to <a href="{{ Page.Meta.Fields.redirect }}">{{ Page.Meta.Fields.redirect_label }}</a>.</p>
  </div>
</section>
{% endblock %}
